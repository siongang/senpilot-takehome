name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
          bash -n deploy/release.sh deploy/ssh-command.sh deploy/backup.sh
          cp .env.example .env
          docker compose --env-file .env.example -f deploy/compose.yaml config --quiet

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: senpilot-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Skip a revision superseded on main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          request = Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/main',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
          )
          with urlopen(request, timeout=30) as response:
              latest = json.load(response)['object']['sha']
          current = latest == os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('deploy=' + str(current).lower() + '\n')
          if not current:
              print('Skipping deployment: main contains a newer revision.')
          PY
      - name: Configure deployment SSH
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload tested revision and deploy
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/release.tar.gz"
          ssh_options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          ssh "${ssh_options[@]}" "root@$DEPLOY_HOST" "upload $GITHUB_SHA" < "$RUNNER_TEMP/release.tar.gz"
          ssh "${ssh_options[@]}" "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
          printf 'Deployed `%s` to the development Droplet.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key
