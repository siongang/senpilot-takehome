[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "senpilot-regulatory-agent"
version = "0.1.0"
description = "Email-driven retrieval of Nova Scotia UARB matter documents"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.48,<2",
  "python-dotenv>=1,<2",
  "openai>=1.70,<3",
  "pydantic>=2,<3",
]

[project.scripts]
senpilot-agent = "senpilot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
